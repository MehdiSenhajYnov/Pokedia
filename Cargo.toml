[package]
name = "pokedia"
version = "0.3.1"
description = "Pokémon Encyclopedia"
authors = ["mehdi"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pokedia_lib"

[[bin]]
name = "pokedia-gtk"
path = "src/bin/pokedia-gtk.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12", features = ["blocking"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
chrono = "0.4"
adw = { package = "libadwaita", version = "0.9.1", features = ["gtk_v4_20", "v1_8"] }
directories = "6.0.0"
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_20"] }
